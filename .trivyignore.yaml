# Trivy suppressions (vulnerabilities, misconfigurations, secrets). Each entry
# needs an id, the narrowest paths/purls that apply, a statement, and an
# expired_at date after which it stops suppressing and the gate fails again.
# Every entry is also listed in docs/SECURITY_GATES.md ("Suppressions").
#
# Example:
# vulnerabilities:
#   - id: CVE-2099-0001
#     purls: ["pkg:pypi/example@1.0.0"]
#     statement: "S-NN: not reachable because ..., see docs/SECURITY_GATES.md"
#     expired_at: 2027-01-31
vulnerabilities: []
misconfigurations: []
secrets:
  # S-01: the documentation example JWT in the OpenAPI definition, which is copied
  # into the API image. Expired in 2022, for a user that does not exist.
  # The same value is allowlisted for Gitleaks (.gitleaks.toml).
  - id: jwt-token
    paths:
      - "/vampi/openapi_specs/openapi3.yml"
    statement: "S-01: documentation example token, see docs/SECURITY_GATES.md"
    expired_at: 2027-05-01
