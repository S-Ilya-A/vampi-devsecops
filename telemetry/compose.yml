# Telemetry stack (Task 4): OpenSearch + OpenSearch Dashboards, single node.
# Started only through scripts/telemetry-up.sh, which generates the CA, the
# certificates, the users and the env file this compose file reads from
# ${TELEMETRY_STATE} (.local/telemetry, git-ignored).
#
# Both ports listen on the host's loopback only. Job containers reach them as
# telemetry.northwind.test (Docker host gateway); the staging VM through
# VirtualBox NAT (10.0.2.2 = host loopback).
name: telemetry

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.6
    container_name: telemetry-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # The demo configuration ships users with published passwords
      # (kibanaro/kibanaro, logstash/logstash, ...) and a private key every
      # OpenSearch download shares. Ours replaces both.
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # The laptop also runs GitLab, the VM and ZAP: keep the heap small.
      OPENSEARCH_JAVA_OPTS: "-Xms768m -Xmx768m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    mem_limit: 1600m
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - data:/usr/share/opensearch/data
      - ./opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ${TELEMETRY_STATE:?run scripts/telemetry-up.sh}/certs:/usr/share/opensearch/config/certs:ro
      # Users (password hashes, generated) and roles (in git). Loaded when the
      # security index is first created; telemetry-up.sh re-applies them on every run.
      - ${TELEMETRY_STATE}/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
      - ./security/config.yml:/usr/share/opensearch/config/opensearch-security/config.yml:ro
      - ./security/roles.yml:/usr/share/opensearch/config/opensearch-security/roles.yml:ro
      - ./security/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml:ro
    healthcheck:
      # Any HTTP answer over TLS means the node is up; 401 is expected without credentials.
      test: ["CMD-SHELL", "curl -s -o /dev/null --cacert config/certs/ca.pem https://localhost:9200/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.6
    container_name: telemetry-dashboards
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      DASHBOARDS_PASSWORD: ${DASHBOARDS_PASSWORD:?run scripts/telemetry-up.sh}
    mem_limit: 768m
    ports:
      - "127.0.0.1:${DASHBOARDS_PORT:-5601}:5601"
    volumes:
      - ./opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
      - ${TELEMETRY_STATE}/certs/ca.pem:/usr/share/opensearch-dashboards/config/ca.pem:ro

volumes:
  data:
