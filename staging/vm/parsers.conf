# 172.18.0.1 - - [09/Nov/2026:10:00:00 +0000] "GET /api/books/v1 HTTP/1.1" 200 512 "-" "Mozilla/5.0"
[PARSER]
    Name        nginx_access
    Format      regex
    Regex       ^(?<client_ip>[^ ]*) - (?<remote_user>[^ ]*) \[(?<http_time>[^\]]*)\] "(?<method>\S+) (?<path>[^ ]*) (?<protocol>[^"]*)" (?<status>\d{3}) (?<bytes>\d+|-) "(?<referer>[^"]*)" "(?<user_agent>[^"]*)"
    Types       status:integer

# 172.18.0.4 - - [09/Nov/2026 10:00:00] "GET /users/v1 HTTP/1.0" 200 -
[PARSER]
    Name        werkzeug_access
    Format      regex
    Regex       ^(?<client_ip>[^ ]*) - - \[(?<http_time>[^\]]*)\] "(?<method>\S+) (?<path>[^ ]*) (?<protocol>[^"]*)" (?<status>\d{3}) (?<bytes>\S+)
    Types       status:integer

# Structured security events written by the application as one JSON object per line.
[PARSER]
    Name        app_event
    Format      json
