# Fluent Bit on the staging VM: application container logs -> OpenSearch (app-logs-*).
#
# Records arrive from Docker's fluentd log driver with the fields
#   container_id, container_name, source (stdout|stderr), log
# and the tag  vampi.<service>  (set per service in the staging compose file).

[SERVICE]
    Flush           2
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers-northwind.conf
    # Filesystem buffer: logs survive OpenSearch being down or the host offline.
    storage.path    /var/lib/fluent-bit
    storage.sync    normal
    storage.backlog.mem_limit 16M
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020

[INPUT]
    Name            forward
    Listen          0.0.0.0
    Port            24224
    storage.type    filesystem

# Werkzeug colours its request lines by status ("\e[33mGET /x HTTP/1.1\e[0m" 404):
# strip ANSI escape sequences first, or the access-log parser matches nothing.
[FILTER]
    Name            lua
    Match           vampi.*
    call            strip_ansi
    code            function strip_ansi(tag, ts, record) if type(record["log"]) == "string" then record["log"] = string.gsub(record["log"], "\27%[[%d;]*m", "") return 2, ts, record end return 0, ts, record end

# nginx access log lines from the web client
[FILTER]
    Name            parser
    Match           vampi.frontend
    Key_Name        log
    Parser          nginx_access
    Reserve_Data    On
    Preserve_Key    On

# Werkzeug request lines and the application's own log lines from the API
[FILTER]
    Name            parser
    Match           vampi.api
    Key_Name        log
    Parser          werkzeug_access
    Parser          app_event
    Reserve_Data    On
    Preserve_Key    On

[FILTER]
    Name            modify
    Match           vampi.*
    Add             environment staging
    Add             host vampi-staging
    Add             stream app

# service name from the tag (vampi.api -> api)
[FILTER]
    Name            lua
    Match           vampi.*
    call            add_service
    code            function add_service(tag, ts, record) record["service"] = string.gsub(tag, "^vampi%.", "") return 1, ts, record end

[OUTPUT]
    Name                opensearch
    Match               vampi.*
    Host                ${OPENSEARCH_HOST}
    Port                ${OPENSEARCH_PORT}
    # TLS verified against the telemetry stack's own CA; the node certificate names
    # telemetry.northwind.test. The shipper account may only append to app-logs-*.
    tls                 On
    tls.verify          On
    tls.ca_file         /fluent-bit/etc/telemetry-ca.pem
    tls.vhost           telemetry.northwind.test
    HTTP_User           ${OPENSEARCH_USER}
    HTTP_Passwd         ${OPENSEARCH_PASSWORD}
    Logstash_Format     On
    Logstash_Prefix     app-logs
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name  On
    Replace_Dots        On
    Trace_Error         On
    # Keep retrying: nothing is dropped while OpenSearch is unreachable.
    Retry_Limit         False
    storage.total_limit_size 256M
