stages:
  - test
  - build

variables:
  API_IMAGE: $CI_REGISTRY_IMAGE/api
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

unit-tests:
  stage: test
  image: python:3.11-slim
  services:
    - name: postgres:15
      alias: db
  variables:
    POSTGRES_DB: vampi
    POSTGRES_USER: vampi
    POSTGRES_PASSWORD: vampi
    DATABASE_URL: postgresql://vampi:vampi@db:5432/vampi
  script:
    - pip install -r requirements.txt pytest==7.2.1
    - python -m pytest -v tests/

frontend-check:
  stage: test
  image: node:14
  script:
    - cd frontend
    - npm install
    - npm test

.docker-build:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

build-api:
  extends: .docker-build
  script:
    - docker build -t "$API_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$API_IMAGE:latest" .
    - docker push "$API_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$API_IMAGE:latest"

build-frontend:
  extends: .docker-build
  script:
    - docker build -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$FRONTEND_IMAGE:latest" frontend
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$FRONTEND_IMAGE:latest"
