stages:
  - test
  - build
  - scan
  - deploy
  - dast
  - report

variables:
  API_IMAGE: $CI_REGISTRY_IMAGE/api
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

# Security gates. Each scanner job writes its full report (every severity) to
# reports/ as a machine-readable artefact, then applies its threshold and fails
# the job when it is breached. Thresholds and suppressions: docs/SECURITY_GATES.md.
#
# Offline: scanner databases and rules live in the CI cache. Every job tries to
# refresh them and falls back to the cached copy when the network is down; with
# neither, the job fails rather than scanning with nothing.
.security-report:
  needs: []
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/]

unit-tests:
  stage: test
  image: python:3.11-slim
  services:
    - name: postgres:15
      alias: db
  variables:
    POSTGRES_DB: vampi
    POSTGRES_USER: vampi
    POSTGRES_PASSWORD: vampi
    DATABASE_URL: postgresql://vampi:vampi@db:5432/vampi
  # A cached virtualenv per requirements.txt: on a cache hit nothing is downloaded,
  # so the job also runs offline. (pip's own cache still queries the index.)
  cache:
    key:
      files: [requirements.txt]
      prefix: venv-py311
    paths: [.venv/]
  script:
    - test -x .venv/bin/python || python -m venv .venv
    - . .venv/bin/activate
    - pip install -q -r requirements.txt pytest==7.2.1
    - python -m pytest -v tests/

frontend-check:
  stage: test
  image: node:14
  cache:
    key:
      files: [frontend/package-lock.json]
      prefix: node14
    paths: [frontend/node_modules/]
  script:
    - cd frontend
    - npm install --prefer-offline --no-audit --no-fund
    - npm test

# The telemetry tooling (tools/nwtelemetry): standard library only, so the tests
# need nothing installed and run offline.
telemetry-tests:
  stage: test
  image: python:3.12-alpine
  needs: []
  script:
    - PYTHONPATH=tools python -m unittest discover -s tools/tests -v

.docker-build:
  stage: build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      # The local GitLab registry is plain HTTP. The runner does not expand variables
      # in services:command, so expand $CI_REGISTRY inside the service container.
      # DIND_REGISTRY_MIRROR (optional) is a local Docker Hub cache.
      entrypoint:
        - sh
        - -c
        - >-
          exec dockerd-entrypoint.sh --insecure-registry="$CI_REGISTRY"
          ${DIND_REGISTRY_MIRROR:+--registry-mirror="$DIND_REGISTRY_MIRROR"}
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Instance-level variables are not passed to service containers; variables
    # declared here are. Empty when the instance does not define a mirror.
    DIND_REGISTRY_MIRROR: $DOCKER_REGISTRY_MIRROR
    # Classic builder on purpose: BuildKit in Docker 20.10 ignores --insecure-registry
    # and --registry-mirror, so remote cache and the mirror never worked with it.
    DOCKER_BUILDKIT: "0"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  # Every dind starts empty, so seed its cache from the registry. The build stage is
  # pushed separately as :cache-build so its layers (apk/pip/npm) are reused too.
  # Unchanged dependencies then mean no package downloads, and the build works offline.
  script:
    - docker pull "$IMAGE:cache-build" || true
    - docker pull "$IMAGE:latest" || true
    - >-
      docker build --target "$BUILD_STAGE"
      --cache-from "$IMAGE:cache-build" -t "$IMAGE:cache-build" "$CONTEXT"
    - >-
      docker build
      --cache-from "$IMAGE:cache-build" --cache-from "$IMAGE:latest"
      -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" "$CONTEXT"
    - docker push "$IMAGE:cache-build"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"

build-api:
  extends: .docker-build
  needs: [unit-tests]
  variables:
    IMAGE: $API_IMAGE
    CONTEXT: .
    BUILD_STAGE: builder

build-frontend:
  extends: .docker-build
  needs: [frontend-check]
  variables:
    IMAGE: $FRONTEND_IMAGE
    CONTEXT: frontend
    BUILD_STAGE: build

# --- SAST: Python and JavaScript --------------------------------------------
# Registry rulesets plus project rules in .semgrep/. Gate: any ERROR finding.
sast-semgrep:
  extends: .security-report
  stage: test
  image: semgrep/semgrep:1.95.0
  variables:
    SEMGREP_RULESETS: default security-audit owasp-top-ten flask javascript jwt
    SEMGREP_RULES_URL: https://semgrep.dev/c/p
  cache:
    key: semgrep-registry-rules
    # A failing gate must still save its data, or the next offline run has none.
    when: always
    paths: [.semgrep-registry/]
  script:
    - mkdir -p reports .semgrep-registry
    - |
      for p in $SEMGREP_RULESETS; do
        if curl -sSfL --retry 2 --max-time 60 -o ".semgrep-registry/$p.yml.new" "$SEMGREP_RULES_URL/$p"; then
          mv ".semgrep-registry/$p.yml.new" ".semgrep-registry/$p.yml"
        else
          rm -f ".semgrep-registry/$p.yml.new"
          echo "WARN: could not refresh ruleset p/$p, using the cached copy"
        fi
        test -s ".semgrep-registry/$p.yml" || { echo "ruleset p/$p is neither cached nor reachable"; exit 1; }
      done
    # Semgrep skips a whole file once 3 rules time out on it (5 s each by
    # default). On a busy runner that happened to frontend/public/app.js, and
    # every XSS finding vanished from one run while the gate passed. Never skip
    # a file (--timeout-threshold 0); bound each rule at 60 s instead. The gate
    # fails if a timeout still occurs.
    - >-
      semgrep scan --metrics=off --disable-version-check
      --timeout 60 --timeout-threshold 0
      --config .semgrep-registry --config .semgrep
      --json --output reports/semgrep.json .
    - python3 ci/semgrep_gate.py reports/semgrep.json --fail-on ERROR

# --- Secrets: the full history of every branch and tag ----------------------
# Gate: any finding. Suppression only by an exact-value allowlist in
# .gitleaks.toml or a fingerprint in .gitleaksignore (docs/SECURITY_GATES.md).
secrets-gitleaks:
  extends: .security-report
  stage: test
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - mkdir -p reports
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # The runner fetches only the pipeline's own ref; fetch every branch and tag
    # so a secret that lives only on another branch is found too.
    - git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
    - echo "commits in scope:" $(git rev-list --all | wc -l)
    - >-
      gitleaks detect --source . --log-opts="--all" --redact --no-banner
      --report-format json --report-path reports/gitleaks.json --exit-code 1

# --- SCA: SBOM of both ecosystems, then vulnerabilities in it ---------------
sbom-syft:
  extends: .security-report
  stage: test
  image:
    name: anchore/syft:v1.18.1-debug
    entrypoint: [""]
  script:
    - mkdir -p reports
    # requirements.txt (pip) and frontend/package-lock.json (npm). Manifests list
    # what is declared; the image SBOMs from the scan stage list what is installed.
    - >-
      /syft scan dir:. --source-name vampi-devsecops --source-version "$CI_COMMIT_SHORT_SHA"
      --exclude ./tests --exclude ./.venv --exclude ./frontend/node_modules
      -o syft-json=reports/sbom.syft.json
      -o cyclonedx-json=reports/sbom.cdx.json
      -o table

# Gate: High or Critical with a released fix. Unfixable ones are in the report.
sca-grype:
  extends: .security-report
  stage: test
  needs: [sbom-syft]
  image:
    name: anchore/grype:v0.99.1-debug
    entrypoint: [""]
    # The image runs as a non-root user, which cannot write the checked-out
    # project directory where the DB cache lives.
    docker:
      user: root
  variables:
    GRYPE_DB_CACHE_DIR: $CI_PROJECT_DIR/.grypedb
    GRYPE_DB_AUTO_UPDATE: "false"
    # Offline runs may use a database up to 30 days old, then fail closed.
    GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 720h
  cache:
    key: grype-db-v6
    # A failing gate must still save its data, or the next offline run has none.
    when: always
    paths: [.grypedb/]
  script:
    - '/grype db update || echo "WARN - could not refresh the vulnerability DB, using the cached copy"'
    # Fail with a clear message if there is no usable DB (first run offline,
    # or older than the allowed age) instead of a scan error further down.
    - '{ /grype db status 2>&1 || true; } | tee reports/grype-db-status.txt'
    - grep -qE '^Status:[[:space:]]+valid$' reports/grype-db-status.txt || { echo "no usable vulnerability DB"; exit 1; }
    - /grype sbom:reports/sbom.syft.json -o json --file reports/grype.json
    - /grype sbom:reports/sbom.syft.json --only-fixed --fail-on high -o table

# --- Container images: OS and language packages, secrets, Dockerfile --------
# Gate: High or Critical vulnerability with a fix, any secret in the image, and
# High or Critical misconfiguration in the Dockerfile the image is built from.
.image-scan:
  extends: .security-report
  stage: scan
  # The download is bounded (5 min) and a scan takes a few minutes; fail well
  # before the runner's 1 h default.
  timeout: 30m
  image:
    name: aquasec/trivy:0.57.1
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.trivycache
    # mirror.gcr.io (the default) served a broken blob at the time of writing.
    TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    # The local registry is plain HTTP.
    TRIVY_INSECURE: "true"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_IGNOREFILE: .trivyignore.yaml
    # Misconfiguration checks embedded in the pinned Trivy release: deterministic and offline.
    TRIVY_SKIP_CHECK_UPDATE: "true"
    # No Java DB. It is only used for Java archives, and neither image has any
    # (the earlier nginx:1.21 base did). It is 952 MB: when the cached copy
    # went stale, both scans downloaded it at once over a slow link and one ran
    # into the 1 h job timeout (#71). A gate below fails if a Java archive
    # appears, so it cannot go unscanned silently.
    TRIVY_SKIP_JAVA_DB_UPDATE: "true"
  cache:
    key: trivy-db
    # A failing gate must still save its data, or the next offline run has none.
    when: always
    # Only the database: the layer cache (fanal/) is large and per-image.
    paths: [.trivycache/db/]
  script:
    - mkdir -p reports
    # Refresh a database, falling back to the cached copy. Trivy deletes the
    # database's metadata.json before it downloads; when the download fails the
    # cached database is left without it, and --skip-db-update then refuses to
    # run ("cannot be specified on the first run"). An offline pipeline with a
    # stale cache hit exactly that (#33), so the metadata is kept and put back.
    # With no cached copy at all the scan below still fails: nothing is scanned
    # with no database.
    # A download that is too slow is treated like one that fails: an
    # unreachable source fails at once, but a slow one has no limit of its own.
    - |
      refresh_db() {  # refresh_db <label> <cache subdirectory> <seconds> <trivy image arguments>
        label="$1"; meta="$TRIVY_CACHE_DIR/$2/metadata.json"; limit="$3"; shift 3
        cp "$meta" "$meta.keep" 2>/dev/null || true
        if timeout "$limit" trivy image "$@"; then rm -f "$meta.keep"; return 0; fi
        if [ ! -s "$meta" ] && [ -s "$meta.keep" ]; then mv "$meta.keep" "$meta"; fi
        rm -f "$meta.keep"
        if [ -s "$meta" ]; then echo "WARN - could not refresh the $label, using the cached copy"
        else echo "WARN - could not refresh the $label and there is no cached copy"; fi
      }
    - refresh_db "vulnerability DB" db 300 --download-db-only
    # Full reports: every severity, all packages (the image SBOM comes from this).
    - >-
      trivy image --skip-db-update --scanners vuln,secret --image-config-scanners secret
      --list-all-pkgs --format json -o "reports/trivy-image-$NAME.json" "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - trivy convert --format cyclonedx -o "reports/sbom-image-$NAME.cdx.json" "reports/trivy-image-$NAME.json"
    - trivy config --format json -o "reports/trivy-config-$NAME.json" "$DOCKERFILE"
    # Gates. All three run, so one failure does not hide another.
    - rc=0
    - >-
      trivy image --skip-db-update --scanners vuln
      --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$CI_COMMIT_SHORT_SHA" || rc=1
    # Secrets block at every severity (Trivy rates a JWT only Medium); the one
    # known false positive is S-01 in .trivyignore.yaml.
    - >-
      trivy image --skip-db-update --scanners secret --image-config-scanners secret
      --exit-code 1 "$IMAGE:$CI_COMMIT_SHORT_SHA" || rc=1
    - trivy config --severity HIGH,CRITICAL --exit-code 1 "$DOCKERFILE" || rc=1
    # Java archives would need the Java DB this job does not keep (see above).
    - >-
      if grep -qE '"Type": "(jar|pom|gradle|sbt)"' "reports/trivy-image-$NAME.json"; then
      echo "ERROR - the image contains Java archives; add the Java DB to this job"; rc=1; fi
    - exit $rc

scan-image-api:
  extends: .image-scan
  needs: [build-api]
  variables:
    NAME: api
    IMAGE: $API_IMAGE
    DOCKERFILE: Dockerfile

scan-image-frontend:
  extends: .image-scan
  needs: [build-frontend]
  variables:
    NAME: frontend
    IMAGE: $FRONTEND_IMAGE
    DOCKERFILE: frontend/Dockerfile

# --- Staging: deploy the images this pipeline built, over SSH ---------------
# The VM comes from scripts/staging-up.sh, which also sets the STAGING_* CI
# variables. The SSH key and pinned host key are protected variables, so only
# pipelines on protected branches can deploy; elsewhere this job does not exist.
#
# Staging deploys even when a gate above failed: it is the target the DAST gate
# scans, not a release. A production deploy would need every gate to pass.
deploy-staging:
  stage: deploy
  needs: [build-api, build-frontend]
  image:
    name: alpine/git:v2.47.2
    entrypoint: [""]
  resource_group: staging
  environment:
    name: staging
    url: http://127.0.0.1:$STAGING_WEB_PORT
  rules:
    - if: $STAGING_SSH_KEY && $STAGING_KNOWN_HOSTS
  # A hung VM must fail the job in minutes, not hold the staging lock for the
  # runner's 1 h default (it once did: the guest kernel stalled mid-scp).
  timeout: 15m
  variables:
    GIT_DEPTH: "1"
  before_script:
    - chmod 600 "$STAGING_SSH_KEY"
    - >-
      SSH_OPTS="-i $STAGING_SSH_KEY -o UserKnownHostsFile=$STAGING_KNOWN_HOSTS
      -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10
      -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
    - remote() { ssh $SSH_OPTS -p "$STAGING_SSH_PORT" "deploy@$STAGING_HOST" "$@"; }
  script:
    - scp $SSH_OPTS -P "$STAGING_SSH_PORT" staging/compose.yml "deploy@$STAGING_HOST:/opt/vampi/compose.yml"
    # The job token is valid only while this job runs; it is passed on stdin and
    # the VM logs out again, so no registry credential stays on the VM.
    - echo "$CI_REGISTRY_PASSWORD" | remote "docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"
    # release.env records what is deployed, so `docker compose` on the VM works
    # for an operator too: docker compose --env-file .env --env-file release.env ps
    - >-
      remote "cd /opt/vampi &&
      printf 'IMAGE_TAG=%s\nREGISTRY=%s\nPIPELINE_ID=%s\n' '$CI_COMMIT_SHORT_SHA' '$CI_REGISTRY' '$CI_PIPELINE_ID' >release.env &&
      docker compose --env-file .env --env-file release.env pull --quiet &&
      docker compose --env-file .env --env-file release.env up -d --remove-orphans --wait --wait-timeout 180;
      rc=\$?; docker logout '$CI_REGISTRY' >/dev/null; exit \$rc"
    - API="http://$STAGING_HOST:$STAGING_API_PORT"
    - WEB="http://$STAGING_HOST:$STAGING_WEB_PORT"
    # "up --wait" returns when the containers run, which is before the servers
    # in them listen. Wait for both; a single request right away once failed
    # with "connection refused" on the web client under load (#33).
    - for i in $(seq 1 30); do wget -qO- "$API/" >/dev/null && break; sleep 2; done
    - for i in $(seq 1 30); do wget -qO /dev/null "$WEB/" && break; sleep 2; done
    # Staging data is disposable: re-seed the demo users and books on every deploy.
    - wget -qO- "$API/createdb"
    - wget -qO /dev/null "$WEB/"
    - remote "cd /opt/vampi && docker compose --env-file .env --env-file release.env ps --format '{{.Service}} {{.Image}} {{.Status}}'"

# --- DAST: OWASP ZAP against staging -----------------------------------------
# Two scans, because the pen test found almost nothing with an unauthenticated
# crawl (docs/PENTEST_SUMMARY.md):
#   baseline  passive crawl of the web client; gate: Medium risk or above
#   api       active scan of every operation in the OpenAPI definition, with a
#             bearer token for a user it registers itself; gate: High risk
# Reports: reports/zap-*.json (+ HTML). Suppressions: .zap/suppressions.json.
.zap:
  stage: dast
  needs: [deploy-staging]
  resource_group: staging
  timeout: 30m
  rules:
    - if: $STAGING_SSH_KEY && $STAGING_KNOWN_HOSTS
  image:
    name: zaproxy/zap-stable:2.16.1
    entrypoint: [""]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/]
  before_script:
    - mkdir -p reports
    # The ZAP scripts write their reports to /zap/wrk.
    - ln -sfn "$CI_PROJECT_DIR/reports" /zap/wrk

dast-zap-baseline:
  extends: .zap
  script:
    - >-
      /zap/zap-baseline.py -t "http://$STAGING_HOST:$STAGING_WEB_PORT/" -m 3 -j -I
      -J zap-baseline.json -r zap-baseline.html
    - >-
      python3 ci/zap_gate.py reports/zap-baseline.json --fail-on medium --suppressions .zap/suppressions.json
      --require-uri "^http://$STAGING_HOST:$STAGING_WEB_PORT/"

dast-zap-api:
  extends: .zap
  variables:
    # Bounded active scan: at most 2 minutes per rule and 12 minutes overall.
    # scanner.injectable=19 adds URL path segments (16) to query (1) and body (2):
    # by default ZAP never attacks /users/v1/{username}, where the SQLi (PT-01) is.
    ZAP_OPTIONS: >-
      -config scanner.maxRuleDurationInMins=2 -config scanner.maxScanDurationInMins=12
      -config scanner.injectable=19
  script:
    - API="http://$STAGING_HOST:$STAGING_API_PORT"
    - python3 ci/dast_session.py "$API" .dast-token reports/openapi-staging.json
    # The definition is imported from a file whose server URL is staging. With
    # -O and a URL, ZAP joined the operations onto the spec's own URL
    # (/openapi.json/users/v1 -> 404) and scanned nothing; with -O host:port the
    # script mistakes the host for a URL scheme. See ci/dast_session.py.
    # ZAP adds this header to every request it sends (ZAP_AUTH_HEADER_* are read
    # by ZAP itself), so the active scan reaches the endpoints behind the login.
    - export ZAP_AUTH_HEADER=Authorization ZAP_AUTH_HEADER_VALUE="Bearer $(cat .dast-token)" ZAP_AUTH_HEADER_SITE="$STAGING_HOST"
    - >-
      /zap/zap-api-scan.py -t /zap/wrk/openapi-staging.json -f openapi -I
      -z "$ZAP_OPTIONS"
      -J zap-api.json -r zap-api.html
    - >-
      python3 ci/zap_gate.py reports/zap-api.json --fail-on high --suppressions .zap/suppressions.json
      --require-uri "^$API/users/v1" --require-uri "^$API/books/v1"

# --- Telemetry: findings, scan runs and job events to OpenSearch ---------------
# Runs after everything else, also when gates failed (those runs are the ones
# worth recording). Every scanner's reports are pulled in as artefacts; a scan
# whose job did not run or produced no report is recorded as "missing", never as
# zero findings. Job events come from the GitLab API (read_api project token).
# The trend for this branch is printed and kept as an artefact. The CI account
# can write pipeline data and read it back, but cannot read application logs,
# so that section of the report says so.
telemetry-report:
  stage: report
  image: python:3.12-alpine
  rules:
    - if: $TELEMETRY_URL && $TELEMETRY_PASSWORD
      when: always
  # No `needs` on purpose: a job in the last stage without it waits for every
  # earlier stage to finish and downloads all their artefacts. With `needs` on
  # the scanner jobs it started as soon as the DAST jobs were skipped after a
  # failed deploy, while an image scan was still running (#34), and recorded
  # that scan as missing.
  variables:
    GIT_DEPTH: "1"
    PYTHONPATH: tools
  script:
    - python -m nwtelemetry.ship --reports reports --zap-suppressions .zap/suppressions.json
    - python -m nwtelemetry.trend --since 30d --ref "$CI_COMMIT_REF_NAME" --format json >reports/trend.json
    - python -m nwtelemetry.trend --since 30d --ref "$CI_COMMIT_REF_NAME" | tee reports/trend.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/trend.json, reports/trend.txt]
