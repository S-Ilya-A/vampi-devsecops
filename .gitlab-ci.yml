stages:
  - test
  - build
  - scan

variables:
  API_IMAGE: $CI_REGISTRY_IMAGE/api
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

# Security gates. Each scanner job writes its full report (every severity) to
# reports/ as a machine-readable artefact, then applies its threshold and fails
# the job when it is breached. Thresholds and suppressions: docs/SECURITY_GATES.md.
#
# Offline: scanner databases and rules live in the CI cache. Every job tries to
# refresh them and falls back to the cached copy when the network is down; with
# neither, the job fails rather than scanning with nothing.
.security-report:
  needs: []
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/]

unit-tests:
  stage: test
  image: python:3.11-slim
  services:
    - name: postgres:15
      alias: db
  variables:
    POSTGRES_DB: vampi
    POSTGRES_USER: vampi
    POSTGRES_PASSWORD: vampi
    DATABASE_URL: postgresql://vampi:vampi@db:5432/vampi
  # A cached virtualenv per requirements.txt: on a cache hit nothing is downloaded,
  # so the job also runs offline. (pip's own cache still queries the index.)
  cache:
    key:
      files: [requirements.txt]
      prefix: venv-py311
    paths: [.venv/]
  script:
    - test -x .venv/bin/python || python -m venv .venv
    - . .venv/bin/activate
    - pip install -q -r requirements.txt pytest==7.2.1
    - python -m pytest -v tests/

frontend-check:
  stage: test
  image: node:14
  cache:
    key:
      files: [frontend/package-lock.json]
      prefix: node14
    paths: [frontend/node_modules/]
  script:
    - cd frontend
    - npm install --prefer-offline --no-audit --no-fund
    - npm test

.docker-build:
  stage: build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      # The local GitLab registry is plain HTTP. The runner does not expand variables
      # in services:command, so expand $CI_REGISTRY inside the service container.
      # DIND_REGISTRY_MIRROR (optional) is a local Docker Hub cache.
      entrypoint:
        - sh
        - -c
        - >-
          exec dockerd-entrypoint.sh --insecure-registry="$CI_REGISTRY"
          ${DIND_REGISTRY_MIRROR:+--registry-mirror="$DIND_REGISTRY_MIRROR"}
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Instance-level variables are not passed to service containers; variables
    # declared here are. Empty when the instance does not define a mirror.
    DIND_REGISTRY_MIRROR: $DOCKER_REGISTRY_MIRROR
    # Classic builder on purpose: BuildKit in Docker 20.10 ignores --insecure-registry
    # and --registry-mirror, so remote cache and the mirror never worked with it.
    DOCKER_BUILDKIT: "0"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  # Every dind starts empty, so seed its cache from the registry. The build stage is
  # pushed separately as :cache-build so its layers (apk/pip/npm) are reused too.
  # Unchanged dependencies then mean no package downloads, and the build works offline.
  script:
    - docker pull "$IMAGE:cache-build" || true
    - docker pull "$IMAGE:latest" || true
    - >-
      docker build --target "$BUILD_STAGE"
      --cache-from "$IMAGE:cache-build" -t "$IMAGE:cache-build" "$CONTEXT"
    - >-
      docker build
      --cache-from "$IMAGE:cache-build" --cache-from "$IMAGE:latest"
      -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" "$CONTEXT"
    - docker push "$IMAGE:cache-build"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"

build-api:
  extends: .docker-build
  needs: [unit-tests]
  variables:
    IMAGE: $API_IMAGE
    CONTEXT: .
    BUILD_STAGE: builder

build-frontend:
  extends: .docker-build
  needs: [frontend-check]
  variables:
    IMAGE: $FRONTEND_IMAGE
    CONTEXT: frontend
    BUILD_STAGE: build

# --- SAST: Python and JavaScript --------------------------------------------
# Registry rulesets plus project rules in .semgrep/. Gate: any ERROR finding.
sast-semgrep:
  extends: .security-report
  stage: test
  image: semgrep/semgrep:1.95.0
  variables:
    SEMGREP_RULESETS: default security-audit owasp-top-ten flask javascript jwt
  cache:
    key: semgrep-registry-rules
    paths: [.semgrep-registry/]
  script:
    - mkdir -p reports .semgrep-registry
    - |
      for p in $SEMGREP_RULESETS; do
        if curl -sSfL --retry 2 --max-time 60 -o ".semgrep-registry/$p.yml.new" "https://semgrep.dev/c/p/$p"; then
          mv ".semgrep-registry/$p.yml.new" ".semgrep-registry/$p.yml"
        else
          rm -f ".semgrep-registry/$p.yml.new"
          echo "WARN: could not refresh ruleset p/$p, using the cached copy"
        fi
        test -s ".semgrep-registry/$p.yml" || { echo "ruleset p/$p is neither cached nor reachable"; exit 1; }
      done
    - >-
      semgrep scan --metrics=off --disable-version-check
      --config .semgrep-registry --config .semgrep
      --json --output reports/semgrep.json .
    - python3 ci/semgrep_gate.py reports/semgrep.json --fail-on ERROR

# --- Secrets: the full history of every branch and tag ----------------------
# Gate: any finding. Suppression only by fingerprint in .gitleaksignore.
secrets-gitleaks:
  extends: .security-report
  stage: test
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - mkdir -p reports
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # The runner fetches only the pipeline's own ref; fetch every branch and tag
    # so a secret that lives only on another branch is found too.
    - git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
    - echo "commits in scope:" $(git rev-list --all | wc -l)
    - >-
      gitleaks detect --source . --log-opts="--all" --redact --no-banner
      --report-format json --report-path reports/gitleaks.json --exit-code 1

# --- SCA: SBOM of both ecosystems, then vulnerabilities in it ---------------
sbom-syft:
  extends: .security-report
  stage: test
  image:
    name: anchore/syft:v1.18.1-debug
    entrypoint: [""]
  script:
    - mkdir -p reports
    # requirements.txt (pip) and frontend/package-lock.json (npm). Manifests list
    # what is declared; the image SBOMs from the scan stage list what is installed.
    - >-
      /syft scan dir:. --source-name vampi-devsecops --source-version "$CI_COMMIT_SHORT_SHA"
      --exclude ./tests --exclude ./.venv --exclude ./frontend/node_modules
      -o syft-json=reports/sbom.syft.json
      -o cyclonedx-json=reports/sbom.cdx.json
      -o table

# Gate: High or Critical with a released fix. Unfixable ones are in the report.
sca-grype:
  extends: .security-report
  stage: test
  needs: [sbom-syft]
  image:
    name: anchore/grype:v0.86.1-debug
    entrypoint: [""]
  variables:
    GRYPE_DB_CACHE_DIR: $CI_PROJECT_DIR/.grypedb
    GRYPE_DB_AUTO_UPDATE: "false"
    # Offline runs may use a database up to 30 days old, then fail closed.
    GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 720h
  cache:
    key: grype-db
    paths: [.grypedb/]
  script:
    - '/grype db update || echo "WARN - could not refresh the vulnerability DB, using the cached copy"'
    - /grype db status
    - /grype sbom:reports/sbom.syft.json -o json --file reports/grype.json
    - /grype sbom:reports/sbom.syft.json --only-fixed --fail-on high -o table

# --- Container images: OS and language packages, secrets, Dockerfile --------
# Gate: High or Critical vulnerability with a fix, any secret in the image, and
# High or Critical misconfiguration in the Dockerfile the image is built from.
.image-scan:
  extends: .security-report
  stage: scan
  image:
    name: aquasec/trivy:0.57.1
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.trivycache
    # mirror.gcr.io (the default) served a broken blob at the time of writing.
    TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    # The local registry is plain HTTP.
    TRIVY_INSECURE: "true"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_IGNOREFILE: .trivyignore.yaml
    # Misconfiguration checks embedded in the pinned Trivy release: deterministic and offline.
    TRIVY_SKIP_CHECK_UPDATE: "true"
  cache:
    key: trivy-db
    paths: [.trivycache/]
  script:
    - mkdir -p reports
    - 'trivy image --download-db-only || echo "WARN - could not refresh the vulnerability DB, using the cached copy"'
    # Full reports: every severity, all packages (the image SBOM comes from this).
    - >-
      trivy image --skip-db-update --scanners vuln,secret --image-config-scanners secret
      --list-all-pkgs --format json -o "reports/trivy-image-$NAME.json" "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - trivy convert --format cyclonedx -o "reports/sbom-image-$NAME.cdx.json" "reports/trivy-image-$NAME.json"
    - trivy config --format json -o "reports/trivy-config-$NAME.json" "$DOCKERFILE"
    # Gates. Both run, so one failure does not hide the other.
    - rc=0
    - >-
      trivy image --skip-db-update --scanners vuln,secret --image-config-scanners secret
      --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$CI_COMMIT_SHORT_SHA" || rc=1
    - trivy config --severity HIGH,CRITICAL --exit-code 1 "$DOCKERFILE" || rc=1
    - exit $rc

scan-image-api:
  extends: .image-scan
  needs: [build-api]
  variables:
    NAME: api
    IMAGE: $API_IMAGE
    DOCKERFILE: Dockerfile

scan-image-frontend:
  extends: .image-scan
  needs: [build-frontend]
  variables:
    NAME: frontend
    IMAGE: $FRONTEND_IMAGE
    DOCKERFILE: frontend/Dockerfile
