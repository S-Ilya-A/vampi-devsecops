<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VAmPI Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/jquery.min.js"></script>
  <script src="vendor/lodash.min.js"></script>
  <script src="vendor/moment.min.js"></script>
</head>
<body>
  <header>
    <h1>VAmPI Library</h1>
    <div id="whoami"></div>
  </header>

  <div id="message"></div>

  <section id="auth">
    <h2>Log in</h2>
    <form id="login-form">
      <input name="username" placeholder="username" autocomplete="username">
      <input name="password" type="password" placeholder="password" autocomplete="current-password">
      <button type="submit">Log in</button>
    </form>
    <h2>Register</h2>
    <form id="register-form">
      <input name="username" placeholder="username">
      <input name="email" placeholder="email">
      <input name="password" type="password" placeholder="password">
      <button type="submit">Register</button>
    </form>
  </section>

  <section id="library" hidden>
    <h2>All books</h2>
    <ul id="books"></ul>

    <h2>Add a book</h2>
    <form id="book-form">
      <input name="book_title" placeholder="title">
      <input name="secret" placeholder="secret content">
      <button type="submit">Add</button>
    </form>

    <h2>Open a book</h2>
    <form id="lookup-form">
      <input name="book_title" placeholder="title">
      <button type="submit">Open</button>
    </form>
    <div id="book-detail"></div>

    <button id="logout">Log out</button>
  </section>

  <footer>Session started <span id="session-start"></span></footer>
  <script src="app.js"></script>
</body>
</html>
