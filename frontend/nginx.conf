server {
    # Unprivileged nginx image: no root, so no port below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Was on (PT-14): the server listed the web root.
    autoindex off;
    # Was disclosed in every Server header and error page (PT-14).
    server_tokens off;

    # Security headers (PT-14; ZAP baseline: missing anti-clickjacking header,
    # CSP not set, X-Content-Type-Options missing). The client loads only its own
    # scripts and styles and calls only /api/, so the policy is 'self' throughout.
    # It also stops inline event handlers, which is what the stored-XSS payload
    # relies on (PT-07): a second line of defence, not the fix for it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The API's own Server header (Werkzeug and Python versions) stays inside.
        proxy_hide_header Server;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
